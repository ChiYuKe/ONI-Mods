title: "来自深渊"
description: "灵感来自《来自深渊》：深渊自有其法则，上升必然伴随代价。\n\n• 上升负荷：复制人下潜越深，向上返回时受到的诅咒越强，诅咒按抵达深度分为六个层阶（阿比斯之渊→最终地），层深按各世界实际深度的百分比划分。\n• 笛级晋升：探窟深度会为复制人晋升笛级（赤笛→白笛），高阶笛级带来永久加成。\n• 生骸化：从「最终地」上升的复制人会被深渊立即重塑为生骸——随机变成一只小动物，并以生骸的身份留在殖民地，生骸的躯体老化极慢（年龄增长 -0.9/周期）、繁殖力旺盛（繁殖度 +30%/周期）。\n• 深渊遗物：在地层深处挖掘，有小概率挖出深渊遗物。\n• 深渊层阶概览：概览栏新增「深渊层阶」，以颜色直观显示六层深渊在地图上的分布。\n• 探窟弹药包：新增弹药包装备卡槽，可在服装纺织机制作。装备后携带量 +800kg、挖掘 +2，常驻免疫第 1~2 层的上升负荷；从第 4、5、6 层上升（4→3、5→4、6→5）时可挡下一次诅咒（受 30 点伤害）并损坏掉落（可与布料缝补修复），挡下第 6 层「最终地」的诅咒时复制人还会获得持续 6 周期、随机搭配的「深渊祝福」（生命恢复、呼吸恢复与减压固定，另随机两条馈赠，存在期间不重复获得），损坏的弹药包会缓缓渗出「祈愿培养基」。"
