title: "来自深渊"
description: "灵感来自《来自深渊》：深渊自有其法则，上升必然伴随代价。\n\n• 上升负荷：复制人下潜越深，向上返回时受到的诅咒越强，诅咒按抵达深度分为六个层阶（阿比斯之渊→最终地）。\n• 笛级晋升：探窟深度会为复制人晋升笛级（红笛→白笛），高阶笛级带来永久加成。\n• 生骸化：从「最终地」的诅咒中幸存的复制人将被深渊重塑为生骸——随机变成一只小动物，并以生骸的身份继续留在殖民地。\n• 深渊遗物：在地层深处挖掘，有小概率挖出深渊遗物。
• 探窟弹药包：新增弹药包装备卡槽，可在服装纺织机制作，装备后携带量 +800kg、挖掘 +2，并免疫第 1~2 层的上升负荷。\n\n所有数值可在存档目录下的 MadeInAbyssConfig.json 中调整。"
staticID: "MadeInAbyss"
